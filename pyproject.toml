[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcds"
version = "0.0.1"
description = "Espectroscopía dieléctrica de bajo coste con NanoVNA-F V2 y sonda coaxial de extremo abierto"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
